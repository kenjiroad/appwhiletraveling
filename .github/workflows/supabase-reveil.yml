# Garde la base Supabase de Debout éveillée.
# Le plan gratuit de Supabase met un projet en pause après environ 7 jours sans activité : la ligue et les comptes
# ne marchent plus. Une petite lecture par jour suffit à l'éviter. Si la base ne répond pas, ce workflow échoue et
# GitHub envoie un e-mail : c'est l'alerte pour aller cliquer « Resume project » sur supabase.com.
#
# À faire une seule fois : GitHub → Settings → Secrets and variables → Actions → New repository secret,
# nom SUPABASE_PUBLISHABLE_KEY, valeur = la « publishable key » de Supabase (la même que sur expo.dev).
name: Garder Supabase éveillé

on:
  schedule:
    - cron: '17 6 * * *' # tous les jours vers 7 h (heure de Paris)
  workflow_dispatch: # bouton « Run workflow » pour tester à la main

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Petite lecture dans la base
        env:
          SUPABASE_URL: https://eoskvfpgsyjhtxkctfoz.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_KEY" ]; then
            echo "Il manque le secret SUPABASE_PUBLISHABLE_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $SUPABASE_KEY" || true)
          echo "Réponse de Supabase : $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "La base ne répond pas : elle est peut-être en pause. Va sur supabase.com et clique « Resume project »."
            exit 1
          fi
